function cart(forceEmpty=false){const selected=forceEmpty?[]:state.cart.map(getProduct).filter(Boolean);const sum=selected.filter(canBuy).reduce((n,p)=>n+p.price,0);return page(`${breadcrumb("Giỏ hàng")}${title("MÓN ĐỒ BẠN ĐÃ CHỌN","Giỏ hàng của bạn.","Thêm vào giỏ chưa giữ món. Tình trạng và giá được kiểm tra lại khi đặt hàng.")}<div class="stepper"><span class="active"><b>1</b>Giỏ hàng</span><span><b>2</b>Thông tin & xác nhận</span><span><b>3</b>Hoàn tất đặt hàng</span></div>${!selected.length?emptyState("Giỏ hàng đang chờ bạn.","Một món đồ hợp gu có thể đang đợi ở vòng tròn này."): `<div class="two-col"><section class="panel"><div class="panel-title"><h2>${selected.length} món đã chọn</h2>${a("home","Tiếp tục khám phá","link")}</div>${selected.map(p=>itemRow(p,`<button class="link small" data-action="remove-cart" data-id="${p.id}">Bỏ khỏi giỏ</button>`,canBuy(p)?"Mỗi món chỉ có 1 chiếc":'<span style="color:var(--red)">Món không còn khả dụng</span>')).join("")}</section><aside class="panel"><p class="eyebrow">TỔNG GIỎ HÀNG</p><div class="summary-row"><span>Giá các món còn khả dụng</span><strong>${money(sum)}</strong></div><div class="summary-row"><span>Vận chuyển</span><span>Đã nằm trong giá</span></div><div class="summary-row summary-total"><span>Tổng cộng</span><strong>${money(sum)}</strong></div>${a("checkout","Tiếp tục đặt hàng "+ic("arrow",15),"btn full")}<p class="caption mt">Thanh toán khi nhận hàng (COD). Mỗi người bán sẽ có một đơn riêng.</p></aside></div>`}`);}
function checkout(){const selected=state.cart.map(getProduct).filter(p=>p&&canBuy(p));if(!selected.length)return cart(true);const sum=selected.reduce((n,p)=>n+p.price,0);return page(`${breadcrumb("Đặt hàng","cart","Giỏ hàng")}${title("THÊM MỘT BƯỚC NỮA","Gửi đến bạn, bằng một vòng tròn mới.")}<div class="stepper"><span><b>✓</b>Giỏ hàng</span><span class="active"><b>2</b>Thông tin & xác nhận</span><span><b>3</b>Hoàn tất đặt hàng</span></div><form class="two-col" data-form="checkout"><div class="stack"><section class="panel"><div class="panel-title"><h2>Thông tin nhận hàng</h2>${ic("pin",18)}</div><div class="form-grid">${field('Họ tên người nhận <b class="required">*</b>',"fullName",address.fullName,'required minlength="2" maxlength="100" autocomplete="off"')}${field('Số điện thoại <b class="required">*</b>',"phone",address.phone,'type="tel" pattern="[+]?[0-9]{9,15}" required autocomplete="off"')}<div class="span2">${field('Địa chỉ nhận hàng <b class="required">*</b>',"address",address.address,'required minlength="10" maxlength="500"',"textarea")}</div></div><p class="caption no-margin">Thông tin mẫu để xem thử. Đơn được tách theo từng người bán.</p></section><section class="panel"><div class="panel-title"><h2>Phương thức thanh toán</h2>${ic("bag",18)}</div><label class="option-box"><input type="radio" name="paymentMethod" value="COD" checked><span><strong>Thanh toán khi nhận hàng (COD)</strong><p>Thanh toán riêng cho từng đơn của từng người bán.</p></span></label></section></div><aside class="panel"><p class="eyebrow">KIỂM TRA LẠI MÓN ĐỒ</p>${selected.map(p=>itemRow(p)).join("")}<div class="summary-row"><span>Phí vận chuyển</span><span>Đã nằm trong giá</span></div><div class="summary-row summary-total"><span>Tổng cộng</span><strong>${money(sum)}</strong></div><button class="btn full" type="submit">Xác nhận đặt hàng ${ic("arrow",16)}</button><p class="caption mt">Đặt hàng thành công sẽ chốt quyền mua món. COD chưa đồng nghĩa đã thu tiền.</p></aside></form>`);}
function checkoutOrders(id){return orders.filter(o=>o.checkout===id&&o.buying);}
function success(id){const list=checkoutOrders(id);const sum=list.reduce((n,o)=>n+total(o),0);return page(`<section class="success-top"><div class="success-mark">${ic("check",30)}</div><p class="eyebrow">CẢM ƠN BẠN ĐÃ CHỌN MẶC TIẾP</p><h1>Món đồ cũ.<br>Niềm vui mới đang đến.</h1><p>Lần đặt hàng <strong>${esc(id)}</strong> đã được xác nhận.<br>Thanh toán khi nhận hàng, riêng theo từng người bán.</p></section><div style="max-width:760px;margin:auto"><div class="panel mb"><div class="row between wrap"><div><span class="small muted">Tổng giá các món</span><h2 class="m0 mt">${money(sum)}</h2></div><div class="right">${statusBadge("CONFIRMED")}<p class="caption">${list.length} đơn theo người bán · COD</p></div></div></div><div class="stack">${list.map(o=>orderCard(o)).join("")}</div><div class="row wrap center mt" style="justify-content:center">${a(`checkoutDetail/${id}`,"Xem chi tiết lần đặt hàng","btn")}${a("home","Tiếp tục khám phá","btn secondary")}</div></div>`);}
function checkoutsPage(){const ids=[...new Set(orders.filter(o=>o.buying).map(o=>o.checkout))];return accountShell(`${title("LỊCH SỬ ĐẶT HÀNG","Các lần đặt hàng","Mỗi lần đặt có thể gồm nhiều đơn, được tách theo người bán.")}<div class="table-filter"><select aria-label="Lọc trạng thái đặt hàng" id="checkout-filter">${options(["CONFIRMED","NEEDS_REVIEW","COMPLETED","CANCELLED"],state.tab,"Tất cả trạng thái")}</select></div><div class="stack">${ids.filter(id=>!state.tab||checkoutOrders(id).some(o=>o.status===state.tab)).map(id=>{const list=checkoutOrders(id);return `<article class="order-card"><div class="order-head"><strong>${id}</strong><span>${list[0].date}</span></div><div class="order-body"><div class="row between wrap"><div><h3>${list.length} đơn · Thanh toán COD</h3><span class="small muted">${list.map(o=>o.id).join(" · ")}</span></div><strong>${money(list.reduce((n,o)=>n+total(o),0))}</strong></div><div class="row mt">${a(`checkoutDetail/${id}`,"Xem chi tiết","btn secondary sm")}${a(`payment/${id}`,"Tình trạng thu COD","link")}</div></div></article>`;}).join("")||emptyState("Chưa có lần đặt phù hợp","Thử chọn trạng thái khác.","checkouts","Xem tất cả")}</div>`,"checkouts");}
function checkoutDetail(id,paymentOnly=false){const list=checkoutOrders(id);if(!list.length)return notFound();const sum=list.reduce((n,o)=>n+total(o),0),collected=list.filter(o=>o.payment==="COLLECTED").reduce((n,o)=>n+total(o),0),due=list.filter(o=>!["CANCELLED","RETURNED"].includes(o.status)).reduce((n,o)=>n+total(o),0);return accountShell(`${breadcrumb(id,"checkouts","Các lần đặt hàng")}${title("LẦN ĐẶT HÀNG",paymentOnly?"Tình trạng thu COD":esc(id),"Thông tin giao nhận và tình trạng thanh toán được theo dõi riêng cho từng đơn.")}<div class="tabs">${a(`checkoutDetail/${id}`,"Các đơn hàng","tab "+(!paymentOnly?"active":""))}${a(`payment/${id}`,"Thanh toán COD","tab "+(paymentOnly?"active":""))}</div>${paymentOnly?`<section class="panel mb"><h2>Thu tiền theo từng người bán</h2><div class="kv"><dt>Tổng lần đặt</dt><dd>${money(sum)}</dd><dt>Cần thu</dt><dd>${money(due)}</dd><dt>Đã ghi nhận thu</dt><dd>${money(collected)}</dd><dt>Còn phải thu</dt><dd>${money(due-collected)}</dd></div><div class="mt">${notice("Ghi nhận COD do người bán khai báo. Xác nhận đã nhận hàng và xác nhận đã thu tiền là hai trạng thái riêng.","gray")}</div></section>`:""}<div class="stack">${list.map(o=>paymentOnly?`<section class="panel"><div class="row between wrap"><div><p class="eyebrow">NGƯỜI BÁN ${esc(o.seller)}</p><h3>${a(`order/${o.id}`,o.id,"link")}</h3></div>${statusBadge(o.payment)}</div><div class="summary-row"><span>Tổng đơn</span><strong>${money(total(o))}</strong></div>${o.payment==="COLLECTED"?'<p class="caption m0">Nguồn: người bán khai báo · Ghi nhận ngày 02/11/2026</p>':""}</section>`:orderCard(o)).join("")}</div>`,"checkouts");}
function orderCard(o){const route=o.buying?"order":"sale",label=o.status==="CONFIRMED"?(o.shipped?"Người bán đã gửi hàng":"Chờ người bán gửi hàng"):statusLabel(o.status);return `<article class="order-card"><div class="order-head"><div class="row wrap"><strong>${o.id}</strong><span class="muted">${o.date} · COD</span></div>${statusBadge(o.status)}</div><div class="order-body">${o.items.map(id=>itemRow(orderProduct(o,id))).join("")}<div class="row between wrap mt"><div><p class="small muted m0">${label}${isHeld(o)?" · Có hạn chế xử lý":""}</p><span class="small">${statusLabel(o.payment)}</span></div><div class="right"><div class="small mb">Tổng đơn: <strong>${money(total(o))}</strong></div>${a(`${route}/${o.id}`,"Xem chi tiết "+ic("arrow",13),"btn secondary sm")}</div></div></div></article>`;}
function ordersPage(selling=false){const list=orders.filter(o=>o.buying!==selling&&(!state.tab||o.status===state.tab));return accountShell(`${title(selling?"GÓC NGƯỜI BÁN":"GÓC NGƯỜI MUA",selling?"Những món đồ bạn trao đi.":"Những món đồ bạn đón về.",selling?"Gửi hàng, ghi nhận thu COD và theo dõi từng đơn bán.":"Theo dõi giao nhận và xem lại thông tin món đồ lúc đặt hàng.")}<div class="tabs">${[["","Tất cả"],["CONFIRMED","Đã xác nhận"],["COMPLETED","Hoàn tất"],["NEEDS_REVIEW","Cần rà soát"],["CANCELLED","Đã hủy"],["RETURNED","Đã hoàn"]].map(([v,l])=>`<button class="tab ${state.tab===v?"active":""}" data-tab="${v}">${l}</button>`).join("")}</div><div class="stack">${list.length?list.map(orderCard).join(""):emptyState("Chưa có đơn ở trạng thái này.","Các đơn phù hợp sẽ xuất hiện tại đây.",selling?"sales":"orders","Xem tất cả đơn","box")}</div>`,selling?"sales":"orders");}
function orderDetail(id,selling=false){
 const o=getOrder(id);if(!o||o.buying===selling)return notFound();const held=isHeld(o),currentCase=activeCase(o),shipAllowed=selling&&!held&&o.status==="CONFIRMED"&&!o.shipped&&o.payment==="UNPAID",receiptAllowed=!selling&&!held&&o.status==="CONFIRMED"&&o.shipped&&!o.received,collectAllowed=selling&&!held&&["CONFIRMED","COMPLETED"].includes(o.status)&&o.shipped&&o.payment==="UNPAID",returnAllowed=selling&&!held&&o.status==="CONFIRMED"&&o.shipped&&!o.received&&o.payment==="UNPAID",cancelAllowed=!selling&&!held&&o.status==="CONFIRMED"&&!o.shipped&&o.payment==="UNPAID";
 const actions=`${shipAllowed?btn(ic("truck",16)+" Ghi thông tin đã gửi hàng","shipment","full",`data-id="${o.id}"`):""}${receiptAllowed?btn(ic("check",16)+" Tôi đã nhận hàng","receipt","full",`data-id="${o.id}"`):""}${collectAllowed?btn("Ghi nhận đã thu đủ COD","collection","full secondary",`data-id="${o.id}"`):""}${returnAllowed?btn("Yêu cầu xác nhận hàng hoàn về","return-request","quiet full",`data-id="${o.id}"`):""}${cancelAllowed?btn("Hủy đơn COD","cancel-order","quiet full",`data-id="${o.id}"`):""}`;
 return accountShell(`${breadcrumb(o.id,selling?"sales":"orders",selling?"Đơn bán":"Đơn mua")}${title(selling?"CHI TIẾT ĐƠN BÁN":"CHI TIẾT ĐƠN MUA",o.id,`Đặt ngày ${o.date} · Lần đặt ${o.checkout}`)}<div class="row wrap mb">${statusBadge(o.status)}${statusBadge(o.payment)}${o.shipped?badge("Đã gửi hàng","blue"):""}</div>${currentCase?`<div class="mb">${notice("Đơn có vụ việc đang mở. Gửi hàng, xác nhận nhận, thu tiền, hủy và chấp nhận hoàn COD đang được chặn trong thời gian xem xét.","amber","flag")}</div>`:o.status==="NEEDS_REVIEW"?`<div class="mb">${notice("Đơn cần rà soát. Hạn chế giao nhận vẫn giữ đến khi đủ điều kiện xử lý.","amber")}</div>`:""}<div class="two-col"><div class="stack"><section class="panel"><div class="panel-title"><h2>Món đồ trong đơn</h2><span class="small muted">Bản lưu lúc đặt</span></div>${o.items.map(id=>{const p=orderProduct(o,id);return itemRow(p,`<button class="link" data-action="snapshot" data-id="${p.id}">Xem bản lưu</button>`,"Số lượng: 1");}).join("")}<div class="summary-row"><span>Vận chuyển</span><span>Đã nằm trong giá</span></div><div class="summary-row summary-total no-margin"><span>Tổng đơn</span><strong>${money(total(o))}</strong></div></section><section class="panel"><div class="panel-title"><h2>Giao nhận</h2>${ic("truck",18)}</div>${!selling||(!held&&o.status==="CONFIRMED")?`<dl class="kv"><dt>Người nhận</dt><dd>${esc(o.address.fullName)}</dd><dt>Điện thoại</dt><dd>${esc(o.address.phone)}</dd><dt>Địa chỉ</dt><dd>${esc(o.address.address)}</dd></dl>`:notice("Thông tin người nhận chỉ hiển thị khi đơn đủ điều kiện giao nhận.","gray")}${o.shipped?`<hr class="rule"><dl class="kv"><dt>Đơn vị vận chuyển</dt><dd>${esc(o.carrier)}</dd><dt>Mã vận đơn</dt><dd>${esc(o.tracking)}</dd></dl><p class="caption m0">Người bán tự đặt vận chuyển và cập nhật thông tin. Không theo dõi hành trình tự động.</p>`:notice("Người bán chưa ghi thông tin đã gửi hàng.","gray")}</section>${o.returnStatus?`<section class="panel"><h2>Yêu cầu hoàn COD</h2>${badge(o.returnStatus==="OPEN"?"Chờ Admin xem xét":o.returnStatus==="ACCEPTED"?"Đã chấp nhận":"Đã từ chối","amber")}<p class="small muted mt">${esc(o.returnReason)}</p>${o.decisionReason?`<p class="small">Lý do quyết định: ${esc(o.decisionReason)}</p>`:""}</section>`:""}</div><aside class="stack"><section class="panel"><h2>Các mốc đơn hàng</h2><ol class="timeline mt"><li><div><strong>Đơn đã xác nhận</strong><small>${o.date} · COD chưa thu</small></div></li><li class="${o.shipped?"":"pending"}"><div><strong>${o.shipped?"Người bán đã gửi hàng":"Chờ gửi hàng"}</strong><small>${o.shipped?esc(o.tracking):"Chưa có thông tin vận đơn"}</small></div></li><li class="${o.received?"":"pending"}"><div><strong>${o.received?"Người mua đã nhận hàng":"Chờ người mua xác nhận nhận"}</strong><small>${o.received?"Đơn hoàn tất":"Không tự xác nhận nhận hàng"}</small></div></li></ol>${actions?`<div class="stack mt" style="gap:10px">${actions}</div>`:""}</section><section class="panel"><p class="eyebrow">THANH TOÁN COD</p><h3>${statusLabel(o.payment)}</h3><p class="small muted">${o.payment==="COLLECTED"?"Nguồn ghi nhận: người bán khai báo đã thu đủ tiền.":"Xác nhận đã nhận hàng không tự xác nhận đã thu tiền."}</p>${!selling?a(`payment/${o.checkout}`,"Xem tình trạng thu COD →","link"):""}</section>${!selling&&!['CANCELLED','RETURNED'].includes(o.status)?`<section class="panel"><h3>Cần xem xét đơn này?</h3><p class="small muted">${o.received?"Khiếu nại món thực tế theo bản lưu của đơn.":"Gửi khiếu nại về việc gửi hoặc nhận hàng."}</p>${canComplain(o)?a(`complaint/${o.id}`,currentCase?"Bổ sung bản khiếu nại":"Gửi khiếu nại","btn secondary full"):notice("Đơn chưa đủ điều kiện gửi thêm bản khiếu nại.","gray")}<div class="mt">${a(`complaints/${o.id}`,"Xem bản khiếu nại đã gửi","link")}</div></section>`:""}</aside></div>`,selling?"sales":"orders");
}
const reportReasons=["Thông tin / ảnh sai hoặc thiếu lỗi","Nghi hàng giả","Hàng cấm / không phù hợp","Nội dung phản cảm","Tin trùng / spam","Dấu hiệu lừa đảo","Lý do khác"];
const itemReasons=["Nhận sai món","Tình trạng khác mô tả / lỗi không khai báo","Thiếu phụ kiện","Nghi hàng giả","Hư hại khi nhận","Lý do khác"];
const deliveryReasons=o=>o.shipped?["Chưa nhận được hàng","Giao hàng chậm","Lý do khác"]:["Người bán chưa gửi hàng","Lý do khác"];
function uploadField(required=false){return `<label class="upload">${ic("upload",25)}<strong>${required?"Ảnh món đồ · Bắt buộc":"Ảnh bằng chứng · Không bắt buộc"}</strong><small>${required?"1–5":"0–5"} ảnh JPEG, PNG hoặc WebP · Tối đa 5 MB / ảnh</small><input type="file" name="photos" accept="image/jpeg,image/png,image/webp" multiple ${required?"required":""}></label><div class="uploads" id="upload-preview"></div>`;}
function complaintPage(id){const o=getOrder(id);if(!o||!o.buying)return notFound();if(!canComplain(o))return accountShell(title("KHIẾU NẠI ĐƠN HÀNG","Đơn chưa đủ điều kiện gửi thêm.")+notice("Vụ việc khác loại, giới hạn bản gửi, thời gian chờ sau đóng hoặc trạng thái đơn hiện tại đang chặn thao tác này.","amber")+a("order/"+id,"Về chi tiết đơn","btn secondary mt"),"orders");const item=o.received;return accountShell(`${breadcrumb("Gửi khiếu nại",`order/${id}`,id)}${title("BÁO CÁO VẤN ĐỀ",item?"Món nhận được có vấn đề?":"Bạn cần hỗ trợ giao nhận?",item?"Chọn đúng món trong đơn và mô tả điều không khớp với bản lưu lúc đặt.":"Khiếu nại giao nhận áp dụng cho toàn bộ đơn, không chọn từng món.")}<div class="two-col"><form class="panel" data-form="complaint" data-id="${id}"><p class="eyebrow">${item?"KHIẾU NẠI MÓN ĐÃ NHẬN · ITEM":"KHIẾU NẠI GIAO NHẬN · DELIVERY"}</p>${item?`<div class="mb"><h3>Chọn món có vấn đề <span class="required">*</span></h3>${o.items.map(pid=>`<label class="check-label"><input type="checkbox" name="affectedItems" value="${pid}"><span>${esc(orderProduct(o,pid).title)}</span></label>`).join("")}</div>`:""}${select('Lý do <b class="required">*</b>',"reason",item?itemReasons:deliveryReasons(o),"","Chọn lý do","required")}${field('Mô tả vấn đề <b class="required">*</b>',"details","",'required minlength="10" maxlength="2000" placeholder="Mô tả vấn đề bạn gặp phải (10–2.000 ký tự)…"',"textarea")}${uploadField()}<button class="btn full mt" type="submit">Gửi khiếu nại ${ic("arrow",15)}</button></form><aside class="stack"><section class="panel"><h2>Đơn ${id}</h2>${o.items.map(pid=>itemRow(orderProduct(o,pid))).join("")}${statusBadge(o.status)}</section>${notice("Vụ việc đang mở sẽ tạm chặn các thao tác giao nhận và COD. Khiếu nại không tự động hoàn tiền.","amber")}${notice("Tối đa 3 bản trong một vụ việc đang mở và 5 bản mới / 24 giờ. Sau khi đóng vụ, chờ 24 giờ để gửi lại cùng loại.","gray")}</aside></div>`,"orders");}
function reportPage(id){const p=getProduct(id);if(!p)return notFound();return page(`${breadcrumb("Báo cáo tin",`detail/${id}`,"Chi tiết món đồ")}${title("GIỮ VÒNG TRÒN RÕ RÀNG","Báo cáo tin bán","Bạn thấy tin có thông tin sai, thiếu hoặc đáng ngờ dù chưa mua món? Hãy cho biết điều bạn phát hiện.")}<div class="two-col"><form class="panel" data-form="report" data-id="${id}">${select('Lý do báo cáo <b class="required">*</b>',"reason",reportReasons,"","Chọn lý do","required")}${field("Thông tin bổ sung","details","",'maxlength="2000" placeholder="Mô tả điều bạn phát hiện. Bắt buộc khi chọn lý do khác."',"textarea")}${uploadField()}<button class="btn full mt" type="submit">Gửi báo cáo ${ic("flag",15)}</button></form><aside class="stack"><section class="panel">${itemRow(p)}<p class="caption">Tin ${p.id}</p></section>${notice("Tối đa 5 báo cáo trong 24 giờ. Bạn sẽ nhận thông báo tiếp nhận và kết quả tóm tắt.","gray")}</aside></div>`);}
function complaintsPage(id){const o=getOrder(id);if(!o)return notFound();const list=cases.filter(c=>c.original&&c.target===id&&(!state.tab||c.status===state.tab)).flatMap(c=>(c.records||[]).filter(record=>record.original).map(record=>({...c,recordId:record.id,reason:record.reason,details:record.details})));return accountShell(`${breadcrumb("Bản khiếu nại đã gửi",`order/${id}`,id)}${title("THEO DÕI YÊU CẦU","Khiếu nại của bạn","Chỉ hiển thị bản bạn đã gửi và kết quả tóm tắt công khai.")}<div class="table-filter"><select id="complaint-filter" aria-label="Lọc trạng thái khiếu nại">${options(["OPEN","IN_REVIEW","CLOSED"],state.tab,"Tất cả trạng thái")}</select></div><div class="stack">${list.map(c=>`<article class="panel"><div class="row between wrap"><h3 class="m0">${c.id} · ${typeLabel(c.type)}</h3>${statusBadge(c.status)}</div><p class="small muted mt">${esc(c.reason)}</p><div class="row between"><span class="caption">Đã gửi ${c.date} · ${id}</span>${a(`complaintDetail/${c.recordId||c.id}`,"Xem bản đã gửi →","link")}</div></article>`).join("")||emptyState("Chưa có bản khiếu nại phù hợp.","Bạn có thể gửi khiếu nại khi đơn đủ điều kiện.",`order/${id}`,"Về chi tiết đơn","flag")}</div>`,"orders");}
function complaintDetail(id){const c=getCase(id);if(!c||!c.original)return notFound();const originalRecord=c.records?.find(r=>r.id===id)||c.records?.find(r=>r.original);if(!originalRecord)return notFound();return accountShell(`${breadcrumb(c.id,`complaints/${c.target}`,"Bản đã gửi")}${title("BẢN KHIẾU NẠI CỦA BẠN",c.id,`${typeLabel(c.type)} · Đơn ${c.target}`)}<div class="two-col"><div class="stack"><section class="panel"><div class="panel-title"><h2>Nội dung đã gửi</h2>${statusBadge(c.status)}</div><h3>${esc(originalRecord.reason)}</h3><p class="description">${esc(originalRecord.details)}</p><p class="caption">Gửi ngày ${c.date} · Bằng chứng minh họa</p><div class="evidence"><button data-action="image" data-product="L04" aria-label="Xem ảnh bằng chứng">${art(getProduct("L04"))}</button></div></section>${c.status==="CLOSED"?`<section class="panel"><p class="eyebrow">KẾT QUẢ TÓM TẮT</p><h2>Vụ việc đã được đóng.</h2><p class="small muted">${esc(c.summary)}</p></section>`:notice("Yêu cầu đã được tiếp nhận. Kết quả tóm tắt sẽ hiển thị ở đây khi vụ việc được đóng.","gray")}</div><aside class="panel"><h2>Tiến trình</h2><ol class="timeline mt"><li><div><strong>Đã tiếp nhận</strong><small>${c.date}</small></div></li><li class="${c.status==="OPEN"?"pending":""}"><div><strong>Đang xem xét</strong><small>Thông tin và bằng chứng được rà soát</small></div></li><li class="${c.status!=="CLOSED"?"pending":""}"><div><strong>Kết quả xử lý</strong><small>${c.status==="CLOSED"?"Đã có kết quả tóm tắt":"Chờ kết quả"}</small></div></li></ol><div class="mt">${a(`order/${c.target}`,"Về chi tiết đơn","btn secondary full")}</div></aside></div>`,"orders");}
function listingBadge(p){return p.adminHidden?badge("Admin ẩn","red"):p.hidden?badge("Bạn đã ẩn","gray"):p.review!=="APPROVED"?statusBadge(p.review):statusBadge(p.status);}
function closet(){const list=owned.filter(p=>!state.tab||(state.tab==="HIDDEN"?(p.hidden||p.adminHidden):state.tab==="PENDING"?p.pending:state.tab==="REJECTED"?p.review==="REJECTED":p.status===state.tab&&p.review==="APPROVED"&&!p.hidden&&!p.adminHidden));return accountShell(`${title("TỦ ĐỒ CỦA BẠN","Trao đi một câu chuyện.","Quản lý tin đăng, phiên bản chờ duyệt và trạng thái bán.",a("sell",ic("plus",15)+"Đăng bán món đồ","btn"))}<div class="tabs">${[["","Tất cả"],["AVAILABLE","Đang bán"],["PENDING","Chờ duyệt"],["REJECTED","Từ chối"],["HIDDEN","Đã ẩn"],["SOLD","Đã bán"]].map(([v,l])=>`<button class="tab ${state.tab===v?"active":""}" data-tab="${v}">${l}</button>`).join("")}</div><div class="stack">${list.map(p=>`<article class="panel">${itemRow(p,listingBadge(p))}<div class="row between wrap mt"><span class="caption">Tin ${p.id} · Phiên bản ${p.version}</span><div class="row">${a(`ownListing/${p.id}`,"Quản lý tin","btn secondary sm")}${a(`revisions/${p.id}`,"Lịch sử","link")}</div></div></article>`).join("")||emptyState("Tủ đồ ở đây còn trống.","Tin phù hợp với trạng thái đã chọn sẽ hiển thị tại đây.","sell","Đăng bán món đồ","hanger")}</div>`,"closet");}
function ownListing(id){const p=owned.find(p=>p.id===id);if(!p)return notFound();return accountShell(`${breadcrumb(p.title,"closet","Tủ đồ của tôi")}${title("QUẢN LÝ TIN ĐĂNG",esc(p.title))}<div class="two-col"><div class="stack"><section class="panel">${itemRow(p,listingBadge(p))}<p class="description mt">${esc(p.description)}</p><p class="description"><strong>Thông tin lỗi:</strong> ${esc(p.flaws)}</p><dl class="kv"><dt>Gửi từ</dt><dd>${esc(p.shipFrom)}</dd><dt>Phiên bản</dt><dd>${p.version} · ${statusLabel(p.review)}</dd><dt>Lượt gửi lại</dt><dd>${p.resubmissions} / 5 · Còn ${5-p.resubmissions} lượt</dd></dl></section>${p.reason?notice(`<strong>Lý do cần chỉnh sửa</strong><br>${esc(p.reason)}`,"amber"):""}${p.pending?notice("Tin đang có một phiên bản chờ duyệt. Chỉ có thể gửi bản sửa tiếp theo sau khi phiên bản này có kết quả.","amber"):""}${p.status==="SOLD"?notice("Tin đã chốt quyền mua. Không thể sửa hoặc mở bán lại bằng nút Hiện.","gray"):""}</div><aside class="panel"><h2>Thao tác với tin</h2><div class="stack mt" style="gap:11px">${!p.pending&&p.status!=="SOLD"&&p.resubmissions<5?a(`edit/${id}`,p.review==="REJECTED"||p.correction?"Sửa & gửi duyệt lại":"Gửi phiên bản sửa","btn full"):""}${p.status==="AVAILABLE"?btn(p.hidden?"Hiện lại tin":"Ẩn tin của tôi","visibility","secondary full",`data-id="${id}" ${p.hidden&&(!canBuy({...p,hidden:false}))?"disabled":""}`):""}${a(`revisions/${id}`,"Xem lịch sử phiên bản","btn secondary full")}</div><p class="caption mt">Bạn chỉ có thể tự hiện tin do mình ẩn và đã đủ điều kiện. Tin Admin ẩn cần quyết định từ Admin.</p></aside></div>`,"closet");}
function listingForm(id){const p=id?owned.find(p=>p.id===id):null;if(id&&!p)return notFound();const form=p||{category:"Áo",size:"",condition:"",title:"",description:"",flaws:"",price:"",shipFrom:""};if(p&&(p.pending||p.status==="SOLD"||p.resubmissions>=5))return ownListing(id);return accountShell(`${breadcrumb(p?"Gửi bản sửa":"Đăng bán","closet","Tủ đồ của tôi")}${title("MẶC TIẾP · TRAO ĐI",p?"Chỉnh lại, để món đồ được kể đúng.":"Món đồ của bạn, câu chuyện tiếp theo.","Điền đúng thông tin và mô tả rõ lỗi. Tin chỉ công khai sau khi được Admin duyệt.")}<form class="two-col" data-form="listing" ${p?`data-id="${id}"`:""}><div class="stack"><section class="panel"><div class="panel-title"><h2>01 / Ảnh món đồ</h2><span class="small muted">1–5 ảnh</span></div>${uploadField(!p)}${p?`<p class="caption">Ảnh hiện có sẽ được giữ nếu bạn không chọn ảnh mới.</p><div style="width:75px;height:85px">${art(p)}</div>`:""}</section><section class="panel"><h2>02 / Thông tin món đồ</h2>${field('Tên món đồ <b class="required">*</b>',"title",form.title,'required minlength="5" maxlength="100" placeholder="Ví dụ: Sơ mi linen dáng rộng màu kem"')}<div class="form-grid">${select('Danh mục <b class="required">*</b>',"category",Object.keys(sizes),form.category,"","required")}${select('Kích cỡ <b class="required">*</b>',"size",sizes[form.category],form.size,"Chọn kích cỡ","required")}</div>${select('Tình trạng <b class="required">*</b>',"condition",conditions,form.condition,"Chọn tình trạng","required")}${field('Mô tả <b class="required">*</b>',"description",form.description,'required minlength="20" maxlength="2000" placeholder="Chất liệu, dáng mặc và thông tin hữu ích khác (20–2.000 ký tự)…"',"textarea")}${field("Thông tin lỗi / lưu ý","flaws",form.flaws,'maxlength="1000" placeholder="Mô tả rõ vết xước, sờn, ố hoặc phần đã sửa…"',"textarea")}<div class="form-grid">${field('Giá bán (VND) <b class="required">*</b>',"price",form.price,'type="number" min="20000" max="5000000" step="1" required placeholder="185000"')}${field('Khu vực gửi hàng <b class="required">*</b>',"shipFrom",form.shipFrom,'required maxlength="100" placeholder="Ví dụ: TP. Hồ Chí Minh"')}</div><p class="caption m0">Giá từ 20.000–5.000.000 ₫. Người bán chịu phí vận chuyển và tính phí này trong giá niêm yết.</p></section></div><aside class="panel preview-listing"><p class="eyebrow">TRƯỚC KHI GỬI DUYỆT</p><h2>Thông tin rõ ràng,<br>vòng tròn bền lâu.</h2><ul class="note-list"><li>Ảnh và mô tả khớp với món thực tế.</li><li>Khai báo lỗi và tình trạng hiện tại.</li><li>Mỗi món chỉ có một phiên bản chờ duyệt.</li> ${p?`<li>Còn ${5-p.resubmissions} / 5 lượt gửi lại khi bị từ chối hoặc yêu cầu sửa.</li>`:""}</ul>${notice("Phiên bản mới cần Admin duyệt. Bản lưu trong đơn đã tạo được giữ nguyên.","gray")}<button class="btn full mt" type="submit">${p?"Gửi phiên bản để duyệt":"Gửi tin chờ duyệt"} ${ic("arrow",15)}</button><div class="center mt">${a("closet","Quay về tủ đồ","link")}</div></aside></form>`,"closet");}
function revisions(id){const p=owned.find(p=>p.id===id);if(!p)return notFound();return accountShell(`${breadcrumb("Lịch sử phiên bản",`ownListing/${id}`,p.title)}${title("THEO DÕI TIN ĐĂNG","Lịch sử phiên bản",esc(p.title))}${notice(`Đã dùng ${p.resubmissions} / 5 lượt gửi lại; còn ${5-p.resubmissions} lượt. Mỗi tin chỉ có một bản chờ duyệt.`,"gray")}<div class="panel mt"><ol class="timeline"><li><div><div class="row wrap"><strong>Phiên bản ${p.version} · ${esc(p.title)}</strong>${statusBadge(p.review)}</div><p class="small muted mt">${p.review==="REJECTED"?esc(p.reason):p.pending?"Đã gửi đầy đủ form. Đang chờ Admin xem xét.":"Thông tin đã được duyệt."}</p><dl class="kv"><dt>Giá</dt><dd>${money(p.price)}</dd><dt>Kích cỡ</dt><dd>${esc(p.size)}</dd><dt>Thông tin lỗi</dt><dd>${esc(p.flaws)}</dd></dl></div></li>${p.version>1?'<li><div><strong>Phiên bản 1</strong><small>Bản trước đã được lưu trong lịch sử.</small></div></li>':""}</ol></div>`,"closet");}
const staffLinks=[["adminQueue","file","Duyệt tin đăng"],["adminCases","flag","Vụ việc"],["adminCollections","bag","Ghi nhận thu COD"],["adminReturns","box","Yêu cầu hoàn COD"]];
function staffShell(content,active){const support=state.role==="SUPPORT";return `<div class="staff-layout"><aside class="staff-side">${brand()}<p class="side-label">${support?"HỖ TRỢ THEO VỤ VIỆC":"KHÔNG GIAN QUẢN TRỊ"}</p>${(support?[["supportCases","flag","Vụ được giao"]]:staffLinks).map(([r,i,l])=>a(r,ic(i,17)+l,"side-link "+(active===r?"active":""))).join("")}<div class="side-bottom">${a("notifications",ic("bell",17)+"Thông báo","side-link")}<button class="side-link" data-action="logout">${ic("logout",17)}Đăng xuất</button><p class="caption">Rewear Circle · Prototype</p></div></aside><div class="staff-main"><header class="staff-top"><span>${support?"Hỗ trợ khách hàng":"Kiểm duyệt & vận hành"}<span class="muted"> &nbsp; / &nbsp; REWEAR CIRCLE</span></span><div class="row"><span>${support?"Nhân viên hỗ trợ · SUP-01":"Quản trị viên"}</span><span class="avatar">${support?"HT":"AD"}</span></div></header><main id="main" class="staff-content" tabindex="-1">${content}</main></div></div>`;}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th scope="col">${h}</th>`).join("")}</tr></thead><tbody>${rows.length?rows.map(row=>`<tr>${row.map(cell=>`<td>${cell}</td>`).join("")}</tr>`).join(""):`<tr><td colspan="${headers.length}" class="center muted">Không có dữ liệu phù hợp.</td></tr>`}</tbody></table></div>`;}
function adminQueue(){const list=owned.filter(p=>p.pending);return staffShell(`${title("KIỂM DUYỆT TIN ĐĂNG","Hàng chờ duyệt","Các phiên bản đang chờ quyết định. Xem đầy đủ ảnh, mô tả và lỗi trước khi duyệt.")}<div class="row between mb"><span class="small muted">${list.length} phiên bản chờ duyệt</span>${statusBadge("PENDING")}</div>${table(["TIN ĐĂNG / PHIÊN BẢN","NGƯỜI BÁN","GIÁ","GỬI DUYỆT",""],list.map(p=>[`<div class="row"><div style="width:48px;height:55px">${art(p)}</div><div><strong>${esc(p.title)}</strong><br><span class="muted">${p.id} / v${p.version} · ${p.category} · ${p.size}</span></div></div>`,"Người bán mẫu · ME",money(p.price),"04/11/2026",a(`adminReview/${p.id}`,"Xem để duyệt →")]))}<p class="screen-footer">Hàng chờ chỉ gồm phiên bản PENDING. Bản đã có quyết định sẽ rời hàng chờ.</p>`,"adminQueue");}

  case "review":{
   if(state.role!=="ADMIN")break;const p=owned.find(p=>p.id===id);if(!p?.pending){toast("Phiên bản không còn chờ duyệt.");break;}if(v.decision==="Từ chối phiên bản"&&!v.reason.trim()){toast("Từ chối cần có lý do.");break;}
   p.pending=false;p.review=v.decision==="Duyệt phiên bản"?"APPROVED":"REJECTED";p.reason=p.review==="REJECTED"?v.reason:"";p.decisionReason=v.reason;p.correction=false;notes.unshift({id:Date.now(),title:p.review==="APPROVED"?"Tin đăng đã được duyệt":"Tin đăng chưa được duyệt",text:p.title+". "+(p.reason||"Phiên bản đã được duyệt."),date:"04/11/2026 · Vừa xong",route:"ownListing/"+p.id,read:false});render();toast("Đã lưu quyết định kiểm duyệt.");break;
  }
  case "case-filter":state.caseStatus=v.status;state.caseType=v.type;state.unassigned=data.has("unassigned");state.assignedId=v.assignedId;if(state.unassigned&&state.assignedId){toast("Chọn chưa phân công hoặc mã Support, không dùng cả hai.");break;}render();break;
  case "assignment":{if(state.role!=="ADMIN")break;const c=getCase(id);if(!c||c.status==="CLOSED")break;if(v.supportId.trim()&&v.supportId.trim()!=="SUP-01"){toast("Tài khoản Support mẫu hợp lệ là SUP-01.");break;}c.assigned=v.supportId.trim()||null;render();toast("Đã lưu phân công. Quyền Support được cập nhật theo vụ.");break;}
  case "case-decision":{
   if(state.role!=="ADMIN")break;const c=getCase(id);if(!c||c.status==="CLOSED")break;
   if(c.type==="REPORT"){
    if((v.outcome==="Không cần xử lý"&&v.listingAction!=="Không thay đổi")||(["Yêu cầu sửa tin","Ẩn tin bán"].includes(v.outcome)&&v.listingAction==="Hiện tin")){toast("Kết quả và thao tác với tin không tương thích.");break;}
    const p=getProduct(c.target);if(v.listingAction==="Ẩn tin"||["Yêu cầu sửa tin","Ẩn tin bán"].includes(v.outcome))p.adminHidden=true;else if(v.listingAction==="Hiện tin")p.adminHidden=false;if(v.outcome==="Yêu cầu sửa tin"){p.correction=true;p.reason=v.summary;}
   }
   c.status="CLOSED";c.summary=v.summary;c.internalNote=v.internalNote;c.closedInPrototype=true;notes.unshift({id:Date.now(),title:"Đã có kết quả xử lý vụ việc",text:v.summary,date:"04/11/2026 · Vừa xong",route:c.type==="REPORT"?"detail/"+c.target:"complaintDetail/"+c.id,read:false});render();toast("Đã đóng vụ việc và lưu tóm tắt kết quả.");break;
  }
  case "admin-visibility":{if(state.role!=="ADMIN")break;const p=getProduct(id);if(!p)break;p.adminHidden=!p.adminHidden;p.reason=v.reason;if(p.adminHidden&&data.has("correction"))p.correction=true;closeModal();render();toast("Đã lưu trạng thái ẩn / hiện của Admin.");break;}
  case "contact":{
   const c=getCase(id);if(!c||c.status==="CLOSED"||c.type==="REPORT"||(state.role==="SUPPORT"&&c.assigned!=="SUP-01")||!["ADMIN","SUPPORT"].includes(state.role))break;
   if(/[\w.+-]+@[\w.-]+\.[A-Za-z]{2,}/.test(v.reason)||/\+?\d[\d\s().-]{7,}\d/.test(v.reason)){toast("Lý do truy cập không chứa email hoặc số điện thoại.");break;}
   const o=getOrder(c.target);modal("Thông tin nhận hàng · Bản mẫu",`${notice("Đã mô phỏng ghi nhận lý do cho lần đọc này.","gray","shield")}<dl class="kv mt"><dt>Người nhận</dt><dd>${esc(o.address.fullName)}</dd><dt>Điện thoại</dt><dd>${esc(o.address.phone)}</dd><dt>Địa chỉ</dt><dd>${esc(o.address.address)}</dd></dl><p class="caption">Chỉ áp dụng cho đơn ${o.id}. Lần đọc sau cần lý do mới.</p>${btn("Đóng thông tin","close-modal","full")}`);break;
  }
  case "collection-filter":state.lookupOrder=v.orderId;state.lookupSeller=v.sellerId;render();break;
  case "return-decision":{
   if(state.role!=="ADMIN")break;const o=getOrder(id);if(!o||o.returnStatus!=="OPEN")break;
   const accept=v.decision==="Chấp nhận hoàn về";if(accept&&activeCase(o)){toast("Chưa chấp nhận được: đơn còn vụ việc đang mở.");break;}
   o.returnStatus=accept?"ACCEPTED":"REJECTED";o.decisionReason=v.reason;if(accept){o.status="RETURNED";o.payment="NOT_DUE";o.items.forEach(pid=>{const p=getProduct(pid);p.status="AVAILABLE";});}render();toast("Đã lưu quyết định hàng hoàn COD.");break;
  }
 }
});
window.addEventListener("hashchange",()=>{if(!location.hash.startsWith("#/"))return;readRoute();closeModal();render();window.scrollTo({top:0,behavior:"instant"});});
$("#modal").addEventListener("click",e=>{if(e.target===$("#modal")){const rect=e.target.getBoundingClientRect();if(e.clientX<rect.left||e.clientX>rect.right||e.clientY<rect.top||e.clientY>rect.bottom)closeModal();}});
readRoute();
// Deep links are review entry points, so select their sample role on first load.
const initial=screens.find(s=>s[1]===state.route+(state.id?"/"+state.id:""));if(initial)setRole(initial[3]);
render();
</script></body>
</html>
